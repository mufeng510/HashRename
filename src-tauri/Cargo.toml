[package]
name = "hashrename"
version = "0.1.0"
description = "Cross-platform file hash deduplication and sequential renaming tool"
authors = ["沐风"]
edition = "2021"
license = "MIT"

[[bin]]
name = "hashrename"
path = "src/main.rs"

[lib]
name = "hashrename_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
md-5 = "0.10"
walkdir = "2"  # Only for platform-specific trash path discovery, NOT for recursive scanning
tempfile = "3"
chrono = "0.4"
log = "0.4"
env_logger = "0.11"
thiserror = "1"
dirs = "5"

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3", features = ["shellapi", "winnt", "fileapi", "handleapi"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
